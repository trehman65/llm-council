services:
  # Backend API Service
  - type: web
    name: llm-council-backend
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /
    plan: free

# Note: Frontend must be deployed separately as a Static Site via Render Dashboard
# See DEPLOY.md for detailed instructions

